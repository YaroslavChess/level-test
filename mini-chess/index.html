<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1a2c54">
<meta name="description" content="Перші шахи для дітей 4–7 років: маленька дошка 5×5, сім рівнів від пішаків до справжньої партії.">
<title>Міні-шахи</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%231a2c54'/%3E%3Ccircle cx='32' cy='22' r='9' fill='%23fff'/%3E%3Cpath d='M24 34h16l4 14H20z' fill='%23fff'/%3E%3Crect x='16' y='46' width='32' height='8' rx='3' fill='%23d6401a'/%3E%3C/svg%3E">
<style>
:root {
  --navy: #1a2c54;
  --navy-dark: #0f1b36;
  --accent: #d6401a;
  --accent-dark: #b23312;
  --blue-light: #e8f2fc;
  --blue-mid: #cfe5f8;
  --sq-light: #f4f9ff;
  --sq-dark: #8fbbe8;
  --gold: #ffc21a;
  --text: #1a2c54;
  --muted: #4f628a;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--blue-light);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  line-height: 1.4;
  min-height: 100vh;
  overflow-x: hidden;
  -webkit-user-select: none;
  user-select: none;
}
button { font: inherit; color: inherit; touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
.hidden { display: none !important; }
svg { display: block; }

/* ---------- Верхня панель ---------- */
.topbar {
  background: var(--navy);
  color: #fff;
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px 12px;
  padding-top: max(8px, env(safe-area-inset-top));
}
.topbar h1 { flex: 1; margin: 0; font-size: 20px; letter-spacing: 0.02em; }
.icon-btn {
  width: 48px; height: 48px;
  border: 0; border-radius: 14px;
  background: rgba(255, 255, 255, 0.12);
  display: flex; align-items: center; justify-content: center;
  cursor: pointer;
  flex: none;
}
.icon-btn svg { width: 28px; height: 28px; }
.icon-btn:hover, .icon-btn:focus-visible { background: rgba(255, 255, 255, 0.24); }
.icon-btn.on-light { background: #fff; border: 2px solid var(--blue-mid); }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

.wrap { max-width: 520px; margin: 0 auto; padding: 16px 16px 40px; }
h2 { font-size: 24px; margin: 4px 0 12px; line-height: 1.2; }
p { margin: 0 0 12px; }
.lead { color: var(--muted); font-size: 16px; }

.btn {
  display: flex; align-items: center; justify-content: center; gap: 10px;
  width: 100%;
  min-height: 60px;
  padding: 12px 18px;
  border: 0; border-radius: 18px;
  font-size: 20px; font-weight: 800;
  cursor: pointer;
  text-decoration: none;
}
.btn svg { width: 30px; height: 30px; flex: none; }
.btn-primary { background: var(--accent); color: #fff; box-shadow: 0 4px 0 var(--accent-dark); }
.btn-primary:hover, .btn-primary:focus-visible { background: var(--accent-dark); }
.btn-secondary { background: #fff; color: var(--navy); border: 3px solid var(--navy); }
.btn-secondary:hover, .btn-secondary:focus-visible { background: var(--blue-mid); }
.btn + .btn { margin-top: 12px; }
.btn:active { transform: translateY(2px); }

/* ---------- Карта рівнів ---------- */
.levels { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin: 8px 0 20px; }
.tile {
  position: relative;
  border: 0; border-radius: 22px;
  background: #fff;
  box-shadow: 0 4px 0 var(--blue-mid);
  padding: 10px 8px 8px;
  cursor: pointer;
  display: flex; flex-direction: column; align-items: center;
  min-height: 150px;
}
.tile:last-child { grid-column: 1 / -1; }
.tile .num {
  position: absolute; left: 10px; top: 8px;
  width: 34px; height: 34px; border-radius: 50%;
  background: var(--navy); color: #fff;
  font-weight: 800; font-size: 18px;
  display: flex; align-items: center; justify-content: center;
}
.tile .pic { width: 84px; height: 84px; display: flex; justify-content: center; }
.tile .pic svg { width: 84px; height: 84px; }
.tile .pic svg + svg { margin-left: -34px; }
.tile .name { font-weight: 800; font-size: 17px; }
.tile .stars { display: flex; gap: 2px; margin-top: 2px; }
.tile .stars svg { width: 24px; height: 24px; }
.tile.locked { background: #dfe8f3; box-shadow: none; }
.tile.locked .pic, .tile.locked .name, .tile.locked .stars { opacity: 0.35; }
.tile .lock { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
.tile .lock svg { width: 54px; height: 54px; }
.tile.next { box-shadow: 0 0 0 4px var(--gold), 0 4px 0 var(--blue-mid); animation: pulse 1.6s ease-in-out infinite; }
@keyframes pulse { 50% { transform: scale(1.03); } }
.shake { animation: shake 0.4s; }
@keyframes shake { 20%, 60% { transform: translateX(-8px); } 40%, 80% { transform: translateX(8px); } }

/* ---------- Зірочки ---------- */
.star-on { fill: var(--gold); stroke: #b7860b; }
.star-off { fill: #e2e8f0; stroke: #b9c4d4; }

/* ---------- Підказка рівня ---------- */
.card { background: #fff; border-radius: 22px; padding: 16px; box-shadow: 0 4px 0 var(--blue-mid); margin-bottom: 16px; }
.hint-board { width: min(100%, 250px); margin: 0 auto 12px; }
.hint-text { display: flex; gap: 10px; align-items: center; font-size: 20px; font-weight: 700; margin: 0; }
.hint-text span { flex: 1; }
.goal { display: flex; gap: 8px; align-items: center; margin-top: 12px; padding: 10px 12px; border-radius: 14px; background: var(--blue-light); font-weight: 700; }
.goal svg { width: 28px; height: 28px; flex: none; }

.toggle { display: flex; flex-direction: column; gap: 8px; margin-bottom: 16px; }
.toggle button {
  border: 3px solid var(--blue-mid); background: #fff; border-radius: 16px;
  padding: 12px 14px; text-align: left; font-weight: 700; font-size: 17px; cursor: pointer;
  display: flex; gap: 10px; align-items: center;
}
.toggle button .radio { width: 24px; height: 24px; border-radius: 50%; border: 3px solid var(--navy); flex: none; }
.toggle button[aria-checked="true"] { border-color: var(--accent); background: #fff4f0; }
.toggle button[aria-checked="true"] .radio { background: var(--accent); box-shadow: inset 0 0 0 4px #fff; border-color: var(--accent); }

.opponents { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.opp {
  border: 0; border-radius: 22px; background: #fff; cursor: pointer;
  padding: 12px 8px; box-shadow: 0 4px 0 var(--blue-mid);
  display: flex; flex-direction: column; align-items: center; gap: 4px;
  font-size: 19px; font-weight: 800;
}
.opp svg { width: 96px; height: 96px; }
.opp small { font-weight: 600; font-size: 14px; color: var(--muted); }
.opp:hover, .opp:focus-visible { box-shadow: 0 0 0 4px var(--accent), 0 4px 0 var(--blue-mid); }

/* ---------- Дошка ---------- */
.board {
  position: relative;
  width: 100%;
  padding-top: 100%;
  border-radius: 14px;
  overflow: hidden;
  box-shadow: 0 0 0 6px var(--navy), 0 10px 24px rgba(26, 44, 84, 0.25);
}
.board .sq {
  position: absolute; width: 20%; height: 20%;
  border: 0; padding: 0; margin: 0;
  background: var(--sq-light);
  cursor: pointer;
}
.board .sq.dark { background: var(--sq-dark); }
.board .sq.last { box-shadow: inset 0 0 0 4px rgba(255, 194, 26, 0.95); }
.board .sq.sel { background-image: linear-gradient(rgba(255, 194, 26, 0.75), rgba(255, 194, 26, 0.75)); }
.board .sq.check { background-image: radial-gradient(circle, rgba(214, 64, 26, 0.95) 0, rgba(214, 64, 26, 0.55) 45%, rgba(214, 64, 26, 0) 72%); }
.board .sq .dot { position: absolute; inset: 0; display: none; z-index: 3; pointer-events: none; }
.board .sq .dot::after {
  content: ""; position: absolute; left: 50%; top: 50%;
  width: 34%; height: 34%; margin: -17% 0 0 -17%;
  border-radius: 50%; background: var(--accent); opacity: 0.85;
  box-shadow: 0 0 0 3px #fff;
}
.board .sq.mv .dot, .board .sq.cap .dot { display: block; }
.board .sq.cap .dot::after {
  width: 86%; height: 86%; margin: -43% 0 0 -43%;
  background: transparent; border: 6px solid var(--accent); box-shadow: none; opacity: 0.9;
}
.board .sq.foe .dot::after { background: var(--navy); opacity: 0.4; box-shadow: none; }
.board .sq.foe.cap .dot::after { background: transparent; border-color: var(--navy); opacity: 0.45; }
.board .pieces { position: absolute; inset: 0; pointer-events: none; z-index: 2; }
.board .pc-wrap {
  position: absolute; left: 0; top: 0; width: 20%; height: 20%;
  transition: transform 0.3s ease-in-out;
  will-change: transform;
}
.board .pieces.no-anim .pc-wrap { transition: none; }
.pc-wrap .pc-in { width: 100%; height: 100%; padding: 5%; transition: transform 0.2s; }
.pc-wrap .pc-in svg { width: 100%; height: 100%; filter: drop-shadow(0 3px 0 rgba(15, 27, 54, 0.25)); }
.pc-wrap.sel .pc-in { transform: scale(1.1); }
.pc-wrap.appear .pc-in { animation: appear 0.3s ease-out; }
.pc-wrap.captured { transition: opacity 0.3s, transform 0.3s; opacity: 0; }
.pc-wrap.captured .pc-in { transform: scale(0.3) rotate(25deg); }
.pc-wrap.jump .pc-in { animation: jump 0.3s ease-in-out; }
.pc-wrap.escaping { transition: transform 0.6s ease-in, opacity 0.6s ease-in; opacity: 0; }
.pc-wrap.glow .pc-in { animation: glow 1s ease-in-out; }
.pc-wrap.morph .pc-in { animation: morph 0.6s ease-in-out; }
@keyframes appear { from { transform: scale(0.2); opacity: 0; } }
@keyframes jump { 50% { transform: scale(1.35) translateY(-10%); } }
@keyframes glow {
  0% { transform: scale(1); filter: none; }
  35% { transform: scale(1.45) translateY(-12%); filter: drop-shadow(0 0 10px #ffc21a) drop-shadow(0 0 18px #fff3b0); }
  70% { transform: scale(1.3) rotate(-8deg); filter: drop-shadow(0 0 14px #ffc21a); }
  100% { transform: scale(1); filter: none; }
}
@keyframes morph { 0% { transform: scale(1) rotateY(0); } 50% { transform: scale(1.3) rotateY(90deg); } 100% { transform: scale(1) rotateY(0); } }

/* Фігури: обведення товще за тіло, тож деталі зливаються в один силует. */
.pc .o { stroke-width: 7; stroke-linejoin: round; }
.pc .d { fill: none; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
.pc .e { stroke: none; }
.pc-w .o { fill: #1a2c54; stroke: #1a2c54; }
.pc-w .f { fill: url(#grad-w); }
.pc-w .d { stroke: #1a2c54; }
.pc-w .e { fill: #1a2c54; }
.pc-b .o { fill: #0b1430; stroke: #0b1430; }
.pc-b .f { fill: url(#grad-b); }
.pc-b .d { stroke: #cfe5f8; }
.pc-b .e { fill: #cfe5f8; }

/* ---------- Екран гри ---------- */
.status {
  display: flex; align-items: center; gap: 10px;
  background: #fff; border-radius: 18px; padding: 6px 12px 6px 6px; margin-bottom: 10px;
  min-height: 60px; font-size: 18px; font-weight: 800;
  box-shadow: 0 3px 0 var(--blue-mid);
}
.status .ava { width: 48px; height: 48px; flex: none; }
.status .ava svg { width: 48px; height: 48px; }
.status .txt { flex: 1; }
.status.my-turn { box-shadow: 0 0 0 3px var(--accent), 0 3px 0 var(--blue-mid); }
.status .thinking { display: inline-flex; gap: 4px; margin-left: 6px; }
.status .thinking i { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); animation: blink 1s infinite; }
.status .thinking i:nth-child(2) { animation-delay: 0.2s; }
.status .thinking i:nth-child(3) { animation-delay: 0.4s; }
@keyframes blink { 50% { opacity: 0.2; } }
.goal-line { font-size: 14px; color: var(--muted); font-weight: 700; margin: 0 0 8px; text-align: center; }
.tray {
  display: flex; align-items: center; gap: 2px; flex-wrap: wrap;
  min-height: 40px; padding: 4px 8px; margin: 8px 0;
  font-size: 14px; font-weight: 700; color: var(--muted);
}
.tray .lbl { margin-right: 6px; }
.tray svg { width: 32px; height: 32px; }
.tray .esc { display: inline-flex; }
.tray .esc svg { opacity: 0.55; }
.board-box { padding: 6px; }
.room {
  background: var(--navy); color: #fff; border-radius: 16px; padding: 10px 14px; margin-bottom: 10px;
  display: flex; align-items: center; justify-content: space-between; gap: 8px; font-weight: 700;
}
.room b { font-size: 28px; letter-spacing: 0.15em; }
.room .net { font-size: 14px; font-weight: 600; opacity: 0.9; text-align: right; }
.game-actions { display: flex; gap: 12px; margin-top: 16px; }
.game-actions .btn { margin: 0; }

/* ---------- Накладки ---------- */
.overlay {
  position: fixed; inset: 0; z-index: 20;
  background: rgba(15, 27, 54, 0.6);
  display: flex; align-items: center; justify-content: center;
  padding: 16px;
}
.dialog {
  background: #fff; border-radius: 26px; padding: 22px 18px 18px;
  width: 100%; max-width: 400px; text-align: center;
  animation: pop 0.35s ease-out;
  max-height: 100%; overflow-y: auto;
}
@keyframes pop { from { transform: scale(0.6); opacity: 0; } }
.dialog h2 { font-size: 30px; margin: 6px 0; }
.dialog .big svg { width: 110px; height: 110px; margin: 0 auto; }
.dialog .reason { color: var(--muted); font-size: 17px; font-weight: 600; }
.result-stars { display: flex; justify-content: center; gap: 8px; margin: 8px 0 16px; }
.result-stars svg { width: 58px; height: 58px; }
.result-stars .star-on { animation: starpop 0.5s ease-out both; }
.result-stars svg:nth-child(2) .star-on { animation-delay: 0.25s; }
.result-stars svg:nth-child(3) .star-on { animation-delay: 0.5s; }
@keyframes starpop { 0% { transform: scale(0); } 70% { transform: scale(1.3); } 100% { transform: scale(1); } }
.result-stars path { transform-origin: 12px 12px; }

.pin-dots { display: flex; justify-content: center; gap: 14px; margin: 12px 0 16px; }
.pin-dots i { width: 20px; height: 20px; border-radius: 50%; border: 3px solid var(--navy); }
.pin-dots i.on { background: var(--navy); }
.keypad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; max-width: 300px; margin: 0 auto; }
.keypad button {
  min-height: 62px; border: 0; border-radius: 16px; background: #fff;
  font-size: 28px; font-weight: 800; cursor: pointer; box-shadow: 0 3px 0 var(--blue-mid);
}
.keypad button:active { transform: translateY(2px); }
.keypad svg { width: 30px; height: 30px; margin: 0 auto; }
.code-input { font-size: 40px; font-weight: 800; letter-spacing: 0.3em; text-align: center; min-height: 56px; margin: 4px 0 12px; }
.msg { padding: 12px 14px; border-radius: 14px; background: #fff4f0; border: 2px solid var(--accent); font-weight: 600; margin: 12px 0; }

.teacher-levels { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; margin-bottom: 12px; }
.teacher-levels button {
  border: 3px solid var(--blue-mid); background: #fff; border-radius: 12px; min-height: 48px;
  font-weight: 800; font-size: 18px; cursor: pointer; padding: 0;
}
.teacher-levels button[aria-checked="true"] { border-color: var(--accent); background: var(--accent); color: #fff; }
.section-title { font-size: 18px; font-weight: 800; margin: 20px 0 8px; }

#confetti { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 30; }

@media (prefers-reduced-motion: reduce) {
  .tile.next { animation: none; }
  .board .pc-wrap { transition-duration: 0.15s; }
}
</style>
</head>
<body>

<!-- Градієнти для фігур (спільні для всіх SVG на сторінці). -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <defs>
    <linearGradient id="grad-w" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#ffe08a"/>
    </linearGradient>
    <linearGradient id="grad-b" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5b7fc9"/>
      <stop offset="1" stop-color="#1a2c54"/>
    </linearGradient>
  </defs>
</svg>

<header class="topbar">
  <button type="button" class="icon-btn hidden" id="btn-home" aria-label="Додому"></button>
  <h1 id="top-title">Міні-шахи</h1>
  <button type="button" class="icon-btn" id="btn-sound" aria-label="Звук"></button>
  <button type="button" class="icon-btn" id="btn-lock" aria-label="Для вчителя"></button>
</header>

<main class="wrap">

  <!-- Карта рівнів -->
  <section id="scr-map">
    <h2>Обери рівень</h2>
    <div class="levels" id="levels"></div>
    <button type="button" class="btn btn-secondary" id="btn-join"></button>
  </section>

  <!-- Підказка рівня й вибір суперника -->
  <section id="scr-intro" class="hidden">
    <h2 id="intro-title"></h2>
    <div class="card">
      <div class="hint-board"><div class="board" id="hint-board"></div></div>
      <p class="hint-text"><span id="hint-text"></span><button type="button" class="icon-btn on-light hidden" id="btn-speak" aria-label="Прочитати вголос"></button></p>
      <div class="goal" id="intro-goal"></div>
    </div>
    <div class="toggle hidden" id="rules-toggle" role="radiogroup" aria-label="Правила">
      <button type="button" role="radio" data-real="0"><span class="radio"></span>Для малят: перемога, коли з’їв короля</button>
      <button type="button" role="radio" data-real="1"><span class="radio"></span>Справжні правила: мат</button>
    </div>
    <div class="opponents">
      <button type="button" class="opp" id="btn-bear"></button>
      <button type="button" class="opp" id="btn-fox"></button>
    </div>
  </section>

  <!-- Гра -->
  <section id="scr-game" class="hidden">
    <div class="room hidden" id="room">
      <span>Кімната <b id="room-code"></b></span>
      <span class="net" id="net-status"></span>
    </div>
    <div class="status" id="status"><span class="ava" id="status-ava"></span><span class="txt" id="status-txt"></span></div>
    <p class="goal-line" id="goal-line"></p>
    <div class="tray" id="tray-top"></div>
    <div class="board-box"><div class="board" id="board"></div></div>
    <div class="tray" id="tray-bottom"></div>
    <div class="game-actions">
      <button type="button" class="btn btn-secondary" id="btn-restart"></button>
    </div>
  </section>

  <!-- Учень: код кімнати -->
  <section id="scr-join" class="hidden">
    <h2>Грати з вчителем</h2>
    <p class="lead">Введи код, який скаже вчитель.</p>
    <div class="code-input" id="join-code" aria-live="polite"></div>
    <div class="keypad" id="join-pad"></div>
    <div class="msg hidden" id="join-msg"></div>
  </section>

  <!-- Панель вчителя -->
  <section id="scr-teacher" class="hidden">
    <h2>Для вчителя</h2>
    <button type="button" class="btn btn-secondary" id="btn-unlock-all"></button>
    <button type="button" class="btn btn-secondary" id="btn-reset">Скинути зірочки</button>
    <div class="section-title">Онлайн-урок</div>
    <p class="lead">Оберіть рівень і створіть кімнату. Учень грає білими й ходить першим, ви — чорними.</p>
    <div class="teacher-levels" id="teacher-levels" role="radiogroup" aria-label="Рівень"></div>
    <div class="toggle hidden" id="teacher-rules" role="radiogroup" aria-label="Правила">
      <button type="button" role="radio" data-real="0"><span class="radio"></span>Для малят: перемога, коли з’їв короля</button>
      <button type="button" role="radio" data-real="1"><span class="radio"></span>Справжні правила: мат</button>
    </div>
    <button type="button" class="btn btn-primary" id="btn-create-room">Створити кімнату</button>
    <div class="msg hidden" id="teacher-msg"></div>
  </section>

</main>

<!-- Результат -->
<div class="overlay hidden" id="result" role="dialog" aria-modal="true" aria-labelledby="result-title">
  <div class="dialog">
    <div class="big" id="result-icon"></div>
    <h2 id="result-title"></h2>
    <p class="reason" id="result-reason"></p>
    <div class="result-stars" id="result-stars"></div>
    <div id="result-actions"></div>
  </div>
</div>

<!-- Пароль вчителя -->
<div class="overlay hidden" id="pin" role="dialog" aria-modal="true" aria-labelledby="pin-title">
  <div class="dialog" id="pin-dialog">
    <h2 id="pin-title">Для вчителя</h2>
    <p class="reason">Введіть пароль</p>
    <div class="pin-dots" id="pin-dots"><i></i><i></i><i></i><i></i></div>
    <div class="keypad" id="pin-pad"></div>
    <button type="button" class="btn btn-secondary" id="pin-cancel" style="margin-top:14px">Скасувати</button>
  </div>
</div>

<canvas id="confetti" class="hidden"></canvas>

<noscript><div class="wrap"><p class="msg">Для гри потрібно увімкнути JavaScript.</p></div></noscript>

<script>
/* ENGINE:START */
var MiniChess = (function () {
  'use strict';

    }

  }

    return null;
  }

  // Зірочки за перемогу білих: 1 — перемога; +1 — чисто (у рівнях з утечею не втік жоден
  // пішак, в інших — втрачено не більше третини своїх фігур); +1 — суперник «Лисичка» чи вчитель.
  function stars(s, opponent) {
    if (!s.over || s.winner !== 'w') return 0;
    var n = 1, clean;
    if (s.rules.promo === 'escape') clean = s.escaped.b === 0;
    else clean = s.start.w - countPieces(s.board, 'w') <= Math.floor(s.start.w / 3);
    if (clean) n++;
    if (opponent !== 'bear') n++;
    return n;
  }

  /* ---------- Боти ---------- */

  function pickRandom(list, rnd) { return list[Math.floor(rnd() * list.length)]; }

  // «Ведмедик»: випадковий хід, але якщо можна щось з'їсти — їсть.
  function botBear(s, rnd) {
    rnd = rnd || Math.random;
    var ms = legalMoves(s), caps = [];
    for (var i = 0; i < ms.length; i++) if (ms[i].capture) caps.push(ms[i]);

  var ADVANCE_WIN = [0, 2.5, 0.9, 0.35, 0.1];
  var ADVANCE_QUEEN = [0, 1.2, 0.5, 0.2, 0];
  var ESCAPE_VALUE = 4;

    var adv = s.rules.promo === 'queen' ? ADVANCE_QUEEN : ADVANCE_WIN;
    for (var i = 0; i < s.board.length; i++) {
      var p = s.board[i];
      if (!p) continue;
      var v = VALUES[p.t];

      sum += p.c === c ? v : -v;
    }
    return sum;
  }

  function negamax(s, depth, alpha, beta, ply, deadline) {

      if (!s.winner) return 0;
      return s.winner === s.turn ? WIN - ply : -(WIN - ply);

    for (var i = 0; i < ms.length; i++) {
      var v = -negamax(applyMove(s, ms[i]), depth - 1, -beta, -alpha, ply + 1, deadline);
      if (v > best) best = v;
      if (v > alpha) alpha = v;
      if (alpha >= beta) break;
    }
    return best;
  }

  function orderMoves(ms) {
    var caps = [], rest = [];
    for (var i = 0; i < ms.length; i++) (ms[i].capture || ms[i].promo ? caps : rest).push(ms[i]);
    return caps.concat(rest);

  function botFox(s, rnd, maxDepth, timeLimit) {

    maxDepth = maxDepth || 3;
    var deadline = Date.now() + (timeLimit || 900);

    for (var depth = 1; depth <= maxDepth; depth++) {
      try {

          var v = -negamax(applyMove(s, ms[i]), depth - 1, -Infinity, Infinity, 1, deadline);
          scored.push(v);
          if (v > top) top = v;
        }
        // Серед рівноцінних ходів — випадковий, щоб ігри не повторювались.
        var good = [];
        for (i = 0; i < ms.length; i++) if (scored[i] >= top - 0.05) good.push(ms[i]);
        best = pickRandom(good, rnd);
        if (top >= WIN - 100) break;
      } catch (e) {
        if (e instanceof Timeout) break;
        throw e;
      }
    }
    return best;
  }

  return {
    LEVELS: LEVELS, QUIET_LIMIT: QUIET_LIMIT,
    parse: parse, createGame: createGame, legalMoves: legalMoves, movesFrom: movesFrom,

    evaluate: evaluate, sqName: sqName, sqIndex: sqIndex, other: other
  };
})();

      this.squares[sq].setAttribute('aria-label', MC.sqName(sq) + (p ? ', ' + (p.c === 'w' ? 'білі' : 'чорні') + ': ' + PIECE_NAMES[p.t] : ''));
    }
  };

  function restartClass(node, cls) {
    node.classList.remove(cls);
    void node.offsetWidth;
    node.classList.add(cls);
  }

  /* ================== ЕКРАНИ ================== */

  var SCREENS = ['map', 'intro', 'game', 'join', 'teacher'];
  var current = 'map';
  function show(name) {
    for (var i = 0; i < SCREENS.length; i++) $('scr-' + SCREENS[i]).classList.toggle('hidden', SCREENS[i] !== name);
    current = name;
    stopConfetti();
    $('btn-home').classList.toggle('hidden', name === 'map');
    if (name !== 'intro') stopDemo();
    window.scrollTo(0, 0);
  }

  function goHome() {
    $('top-title').textContent = 'Міні-шахи';
    stopGame();
    netClose();
    hideOverlay('result');
    renderMap();
    show('map');
  }

  /* ---------- Карта ---------- */

  function renderMap() {
    var box = $('levels');
    box.innerHTML = '';
    var nextMarked = false;
    for (var lv = 1; lv <= LEVEL_COUNT; lv++) {
      var info = LEVEL_INFO[lv - 1], open = isOpen(lv), st = progress.stars[lv - 1];
      var t = el('button', 'tile' + (open ? '' : ' locked'));
      t.type = 'button';
      var pic = info.piece === 'all' ? pieceSvg('k', 'w') + pieceSvg('q', 'b') : pieceSvg(info.piece, 'w');
      var stars = '';
      for (var i = 1; i <= 3; i++) stars += starSvg(st >= i);
      t.innerHTML = '<span class="num">' + lv + '</span><span class="pic">' + pic + '</span>' +
        '<span class="name">' + info.name + '</span><span class="stars">' + stars + '</span>' +
        (open ? '' : '<span class="lock">' + ICONS.lockBig + '</span>');
      t.setAttribute('aria-label', 'Рівень ' + lv + ': ' + info.name + (open ? ', зірочок: ' + st : ', закрито'));
      if (open && !st && !nextMarked) { t.className += ' next'; nextMarked = true; }
      t.addEventListener('click', makeLevelTap(lv, t));
      box.appendChild(t);
    }
  }
  function makeLevelTap(lv, tile) {
    return function () {
      Sound.unlock();
      if (!isOpen(lv)) {
        Sound.play('error');
        restartClass(tile, 'shake');
        return;
      }
      openIntro(lv);
    };
  }

  /* ---------- Підказка рівня ---------- */

  var intro = { level: 1, real: false };
  var hintView = null;
  var demoTimer = null;

  function openIntro(lv) {
    intro.level = lv;
    intro.real = false;
    $('intro-title').textContent = 'Рівень ' + lv + ': ' + LEVEL_INFO[lv - 1].name;
    $('rules-toggle').classList.toggle('hidden', lv !== LEVEL_COUNT);
    show('intro');
    renderIntro();
  }

  function renderIntro() {
    var info = LEVEL_INFO[intro.level - 1], real = intro.real && info.hintReal;
    $('hint-text').textContent = real ? info.hintReal : info.hint;
    $('intro-goal').innerHTML = ICONS.target + '<span></span>';
    $('intro-goal').lastChild.textContent = real ? info.goalReal : info.goal;
    setRadio($('rules-toggle'), intro.real ? '1' : '0');
    startDemo(real ? info.demoReal : info.demo, real ? MC.createGame(LEVEL_COUNT, true).rules : MC.LEVELS[intro.level - 1].rules);
  }

  function setRadio(group, val) {
    var bs = group.getElementsByTagName('button');
    for (var i = 0; i < bs.length; i++) bs[i].setAttribute('aria-checked', bs[i].getAttribute('data-real') === val ? 'true' : 'false');
  }

  function startDemo(d, rules) {
    stopDemo();
    if (!hintView) hintView = new BoardView($('hint-board'), null);
    var board = MC.parse(d.setup), hero = MC.sqIndex(d.hero), seg = 0;
    var moves = MC.movesFrom({ board: board, rules: rules }, hero);
    hintView.sync(board, { instant: true });
    hintView.marks({ sel: hero, moves: moves });
    function step() {
      var to = MC.sqIndex(d.path[seg % d.path.length]), b2 = board.slice();
      b2[to] = b2[hero];
      b2[hero] = null;
      hintView.sync(b2, { jumpId: d.jump ? b2[to].id : null });
      hintView.marks({ sel: to, check: d.check ? MC.sqIndex(d.check) : -1 });
      demoTimer = later(function () {
        hintView.sync(board, { instant: true });
        hintView.marks({ sel: hero, moves: moves });
        seg++;
        demoTimer = later(step, 700);
      }, 1500);
    }
    demoTimer = later(step, 900);
  }
  function stopDemo() {
    if (demoTimer) window.clearTimeout(demoTimer);
    demoTimer = null;
  }

  /* ================== ГРА ================== */

  var G = {
    mode: 'bot',          // bot | online
    level: 1,
    real: false,
    opponent: 'bear',     // bear | fox | teacher (з погляду учня) або student (з погляду вчителя)
    me: 'w',
    state: null,
    sel: -1,
    busy: false,
    moves: [],            // [[from, to], ...] — для синхронізації онлайн
    taken: { w: [], b: [] },  // що з'їв кожен колір
    gameNo: 0,
    timers: []
  };
  var view = null;

  function gameLater(fn, ms) { G.timers.push(later(fn, ms)); }
  function clearGameTimers() {
    for (var i = 0; i < G.timers.length; i++) window.clearTimeout(G.timers[i]);
    G.timers = [];
  }

  function stopGame() {
    clearGameTimers();
    G.state = null;
    G.busy = false;
  }

  function startGame(level, opts) {
    clearGameTimers();
    hideOverlay('result');
    G.mode = opts.mode;
    G.level = level;
    G.real = !!opts.real;
    G.opponent = opts.opponent;
    G.me = opts.me || 'w';
    G.state = MC.createGame(level, G.real);
    G.sel = -1;
    G.busy = false;
    G.moves = [];
    G.taken = { w: [], b: [] };
    if (!view) view = new BoardView($('board'), onSquare);
    view.flip = G.me === 'b';
    view.layout();
    var replay = opts.moves || [];
    for (var i = 0; i < replay.length; i++) {
      var m = MC.findMove(G.state, replay[i][0], replay[i][1]);
      if (!m) break;
      record(m);
    }
    view.sync(G.state.board, { instant: true });
    var info = LEVEL_INFO[level - 1];
    $('goal-line').textContent = (G.real && info.goalReal) ? info.goalReal : info.goal;
    $('top-title').textContent = 'Рівень ' + level;
    $('room').classList.toggle('hidden', G.mode !== 'online');
    $('btn-restart').classList.toggle('hidden', G.mode === 'online' && G.me === 'w');
    show('game');
    refresh();
    if (G.state.over) gameLater(showResult, 300);
  }

  function record(m) {
    var before = G.state;
    G.state = MC.applyMove(before, m);
    G.moves.push([m.from, m.to]);
    var last = G.state.last;
    if (last.captured) G.taken[last.piece.c].push(last.captured.t);
    return G.state;
  }

  function myTurn() {
    return G.state && !G.state.over && !G.busy && G.state.turn === G.me;
  }

  function onSquare(sq) {
    Sound.unlock();
    if (!G.state) return;
    var s = G.state;
    if (G.sel >= 0 && myTurn() && s.board[G.sel] && s.board[G.sel].c === G.me) {
      var m = MC.findMove(s, G.sel, sq);
      if (m) {
        G.sel = -1;
        playMove(m, false);
        return;
      }
    }
    G.sel = (s.board[sq] && sq !== G.sel) ? sq : -1;
    if (G.sel >= 0) Sound.play('select');
    renderMarks();
  }

  function playMove(m, fromNet) {
    var mover = G.state.board[m.from];
    var ns = record(m);
    var last = ns.last;
    G.sel = -1;
    G.busy = true;
    if (G.mode === 'online' && !fromNet) send('move', { from: m.from, to: m.to, ply: ns.plies - 1, game: G.gameNo });

    Sound.play(last.capture ? 'capture' : 'move');
    view.sync(ns.board, {
      jumpId: mover.t === 'n' ? mover.id : null,
      escape: last.escaped ? { id: mover.id, to: m.to } : null
    });
    refresh();

    var wait = 350;
    if (last.escaped) {
      gameLater(function () { Sound.play('escape'); }, 320);
    } else if (m.promo) {
      // Пішак дійшов до останнього ряду: сяйво, конфеті, а в рівні 7 — перетворення на ферзя.
      wait = 1200;
      var mine = mover.c === G.me;
      gameLater(function () {
        var w = view.pieceEl(mover.id);
        if (w) restartClass(w, 'glow');
        if (mine) {
          Sound.play('promo');
          launchConfetti(90);
        }
      }, 300);
    }
    gameLater(afterMove, wait);
  }

  function afterMove() {
    G.busy = false;
    if (!G.state) return;
    if (G.state.over) {
      refresh();
      gameLater(showResult, 600);
      return;
    }
    refresh();
    if (G.mode === 'bot' && G.state.turn !== G.me) {
      G.busy = true;
      refresh();
      gameLater(botMove, Math.max(0, BOT_DELAY - 350));
    }
  }

  function botMove() {
    if (!G.state || G.state.over) return;
    var m = G.opponent === 'fox' ? MC.botFox(G.state) : MC.botBear(G.state);
    G.busy = false;
    if (m) playMove(m, false);
  }

  function refresh() {
    renderMarks();
    renderStatus();
    renderTrays();
    view.label(G.state.board);
  }

  function renderMarks() {
    if (!G.state || !view) return;
    var s = G.state, m = { last: s.last, check: -1 };
    if (G.sel >= 0 && s.board[G.sel]) {
      var p = s.board[G.sel];
      m.sel = G.sel;
      m.moves = MC.movesFrom(s, G.sel);
      m.foe = !(p.c === G.me && s.turn === G.me && !s.over);
      var w = view.pieceEl(p.id);
      if (w) w.classList.add('sel');
    }
    if (s.rules.king || s.rules.mate) {
      for (var i = 0; i < 2; i++) {
        var c = i ? 'b' : 'w';
        if (MC.inCheck(s.board, c)) m.check = MC.kingSquare(s.board, c);
      }
    }
    view.marks(m);
    if (m.sel >= 0) {
      var w2 = view.pieceEl(s.board[m.sel].id);
      if (w2) w2.classList.add('sel');
    }
  }

  function opponentName() {
    if (G.opponent === 'fox') return 'Лисичка';
    if (G.opponent === 'bear') return 'Ведмедик';
    if (G.opponent === 'teacher') return 'Вчитель';
    return 'Учень';
  }

  function renderStatus() {
    var s = G.state, box = $('status'), txt, ava;
    var foeAva = AVATARS[G.opponent] || AVATARS.student;
    var mineAva = pieceSvg('p', G.me);
    if (s.over) {
      txt = 'Гру закінчено';
      ava = s.winner === G.me ? mineAva : foeAva;
    } else if (myTurn()) {
      txt = 'Твій хід';
      ava = mineAva;
    } else {
      // Хід суперника або ще анімується його хід.
      txt = opponentName() + (G.mode === 'bot' ? ' думає' : ' ходить');
      ava = foeAva;
    }
    box.classList.toggle('my-turn', myTurn());
    $('status-ava').innerHTML = ava;
    $('status-txt').innerHTML = '';
    $('status-txt').appendChild(document.createTextNode(txt));
    if (!s.over && !myTurn()) $('status-txt').appendChild(el('span', 'thinking', '<i></i><i></i><i></i>'));
  }

  function trayHtml(list, color) {
    var h = '';
    for (var i = 0; i < list.length; i++) h += pieceSvg(list[i], color);
    return h;
  }

  function renderTrays() {
    var s = G.state, foe = MC.other(G.me);
    var top = $('tray-top'), bottom = $('tray-bottom');
    if (s.rules.promo === 'escape') {
      var sc = MC.score(s), eaten = [], esc = [], i;
      for (i = 0; i < sc.eaten; i++) eaten.push('p');
      for (i = 0; i < sc.escaped; i++) esc.push('p');
      // Учень (білі) їсть пішаків; пішаки чорних утікають.
      var eatenHtml = '<span class="lbl">З’їдено: ' + sc.eaten + '</span>' + trayHtml(eaten, 'b');
      var escHtml = '<span class="lbl">Утекли: ' + sc.escaped + '</span>' + ICONS.run + '<span class="esc">' + trayHtml(esc, 'b') + '</span>';
      top.innerHTML = G.me === 'w' ? escHtml : eatenHtml;
      bottom.innerHTML = G.me === 'w' ? eatenHtml : escHtml;
      return;
    }
    top.innerHTML = trayHtml(G.taken[foe], G.me);
    bottom.innerHTML = trayHtml(G.taken[G.me], foe);
  }

  /* ---------- Результат ---------- */

  function showResult() {
    var s = G.state;
    if (!s || !s.over) return;
    var win = s.winner === G.me, draw = !s.winner;
    var r = REASONS[s.reason] || {}, reason = '';
    if (s.reason === 'score') {
      var sc = MC.score(s);
      reason = 'З’їдено: ' + sc.eaten + ', утекли: ' + sc.escaped + '.';
    } else {
      reason = draw ? (r.d || '') : (win ? r.w : r.l) || '';
    }
    var stars = 0;
    if (G.me === 'w' && win) {
      stars = MC.stars(s, G.opponent);
      if (stars > progress.stars[G.level - 1]) {
        progress.stars[G.level - 1] = stars;
        saveProgress();
      }
    }
    var title = draw ? 'Нічия' : win ? 'Перемога!' : 'Спробуй ще раз!';
    if (G.me === 'b') title = draw ? 'Нічия' : win ? 'Ви виграли' : 'Учень виграв!';
    $('result-title').textContent = title;
    $('result-reason').textContent = reason;
    $('result-icon').innerHTML = draw ? ICONS.draw : (win || G.me === 'b') ? ICONS.trophy : ICONS.hug;
    var starBox = $('result-stars');
    starBox.innerHTML = '';
    if (G.me === 'w' && win) {
      for (var i = 1; i <= 3; i++) starBox.innerHTML += starSvg(stars >= i);
    }
    starBox.classList.toggle('hidden', !(G.me === 'w' && win));

    var acts = $('result-actions');
    acts.innerHTML = '';
    if (G.mode === 'bot') {
      if (win && G.level < LEVEL_COUNT) acts.appendChild(actionBtn('btn-primary', ICONS.next, 'Далі', function () {
        hideOverlay('result');
        openIntro(G.level + 1);
      }));
      acts.appendChild(actionBtn(win ? 'btn-secondary' : 'btn-primary', ICONS.retry, 'Ще раз', function () {
        startGame(G.level, { mode: 'bot', real: G.real, opponent: G.opponent });
      }));
    } else if (G.me === 'b') {
      acts.appendChild(actionBtn('btn-primary', ICONS.retry, 'Нова гра', teacherNewGame));
    } else {
      acts.appendChild(el('p', 'reason', 'Вчитель може почати нову гру.'));
    }
    acts.appendChild(actionBtn('btn-secondary', ICONS.homeDark, 'Додому', goHome));
    $('result').classList.remove('hidden');

    if (win && G.me === 'w') {
      Sound.play('win');
      launchConfetti(160);
    } else if (!win && !draw && G.me === 'w') {
      Sound.play('lose');
    }
  }

  function actionBtn(cls, icon, text, fn) {
    var b = el('button', 'btn ' + cls, icon);

    b.appendChild(document.createTextNode(text));

    return b;
  }
  function hideOverlay(id) { $(id).classList.add('hidden'); }

  /* ================== ВЧИТЕЛЬ: пароль і панель ================== */

  var pinValue = '';
  function buildPad(box, onDigit, onDel) {
    var keys = ['1', '2', '3', '4', '5', '6', '7', '8', '9', '', '0', 'del'];
    box.innerHTML = '';

  function renderPinDots() {
    var dots = $('pin-dots').getElementsByTagName('i');
    for (var i = 0; i < dots.length; i++) dots[i].className = i < pinValue.length ? 'on' : '';
  }

  function makeTeacherLevel(lv) { return function () { teacherPick.level = lv; renderTeacher(); }; }

  /* ================== ОНЛАЙН (Ably) ================== */
  // Протокол каналу mini-chess:<код>:
  //   hello {}                         — учень зайшов (або просить повторити стан);
  //   setup {level, real, moves, game} — вчитель надсилає рівень і всі ходи поточної гри;
  //   move  {from, to, ply, game}      — хід; ply — номер півходу до цього ходу;
  //   bye   {}                         — хтось вийшов.
  // Учень завжди грає білими, вчитель — чорними. Ходи перевіряються на обох сторонах.

  var Net = { client: null, ch: null, role: '', code: '', helloTimer: null };

  function ablyConfigured() {
    return typeof ABLY_KEY === 'string' && ABLY_KEY.length > 10 && ABLY_KEY.indexOf('<') < 0;
  }

  function loadAbly(cb) {
    if (window.Ably && window.Ably.Realtime) { cb(true); return; }
    var s = document.createElement('script');
    s.src = ABLY_SRC;
    s.integrity = ABLY_SRI;
    s.crossOrigin = 'anonymous';
    s.onload = function () { cb(!!(window.Ably && window.Ably.Realtime)); };
    s.onerror = function () { cb(false); };
    document.head.appendChild(s);
  }

  function netConnect(code, role, onReady, onFail) {
    if (!ablyConfigured()) {
      onFail('Онлайн-гру ще не налаштовано: потрібно вставити ключ Ably у файл (ABLY_KEY).');
      return;
    }
    loadAbly(function (ok) {
      if (!ok) { onFail('Не вдалося під’єднатися. Перевірте інтернет і спробуйте ще раз.'); return; }
      try {
        Net.client = new window.Ably.Realtime({
          key: ABLY_KEY,
          clientId: role + '-' + Math.floor(Math.random() * 1e9).toString(36),
          echoMessages: false
        });
        Net.role = role;
        Net.code = code;
        Net.client.connection.on(function (ch) { setNetStatus(ch.current); });
        Net.ch = Net.client.channels.get(ROOM_PREFIX + code);
        Net.ch.subscribe(function (msg) { onNet(msg.name, msg.data || {}); });
      } catch (e) {
        onFail('Не вдалося під’єднатися. Перевірте ключ Ably.');
        return;
      }
      onReady();
    });
  }

  function send(name, data) {
    if (!Net.ch) return;
    try {
      var p = Net.ch.publish(name, data);
      if (p && typeof p.then === 'function') p.then(null, function () { setNetStatus('failed'); });
    } catch (e) { setNetStatus('failed'); }
  }

  function netClose() {
    if (Net.helloTimer) window.clearInterval(Net.helloTimer);
    if (Net.client) {
      send('bye', {});
      var c = Net.client;
      later(function () { try { c.close(); } catch (e) { /* вже закрито */ } }, 300);
    }
    Net = { client: null, ch: null, role: '', code: '', helloTimer: null };
  }

  var NET_TEXT = {
    initialized: 'Під’єднуємось…', connecting: 'Під’єднуємось…', connected: 'На зв’язку',
    disconnected: 'Зв’язок перервано, повторюємо…', suspended: 'Немає зв’язку', closing: '', closed: '',
    failed: 'Помилка зв’язку'
  };
  var peerText = '';
  function setNetStatus(state) {
    if (current === 'join' && (state === 'failed' || state === 'suspended')) {
      // Учень ще вводить код: повертаємо можливість спробувати знову.
      netClose();
      joinCode = '';
      renderJoin();
      $('join-msg').textContent = 'Не вдалося під’єднатися. Перевірте інтернет і введіть код ще раз.';
      return;
    }
    var t = NET_TEXT[state] || '';
    if (state === 'connected' && peerText) t = peerText;
    $('net-status').textContent = t;
  }
  function setPeer(text) {
    peerText = text;
    $('net-status').textContent = text;
  }

  /* ---------- Вчитель ---------- */

  function createRoom() {
    var code = String(1000 + Math.floor(Math.random() * 9000));
    $('teacher-msg').classList.add('hidden');
    netConnect(code, 'teacher', function () {
      G.gameNo = 1;
      $('room-code').textContent = code;
      peerText = '';
      startGame(teacherPick.level, { mode: 'online', real: teacherPick.level === LEVEL_COUNT && teacherPick.real, opponent: 'student', me: 'b' });
      setPeer('Чекаємо учня…');
      sendSetup();
    }, function (msg) {
      $('teacher-msg').textContent = msg;
      $('teacher-msg').classList.remove('hidden');
    });
  }

  function sendSetup() {
    send('setup', { level: G.level, real: G.real, moves: G.moves, game: G.gameNo });
  }

  function teacherNewGame() {
    G.gameNo++;
    startGame(G.level, { mode: 'online', real: G.real, opponent: 'student', me: 'b' });
    sendSetup();
  }

  /* ---------- Учень ---------- */

  var joinCode = '';
  function openJoin() {
    joinCode = '';
    renderJoin();
    $('join-msg').classList.add('hidden');
    show('join');
  }
  function renderJoin() {
    var t = '';
    for (var i = 0; i < 4; i++) t += i < joinCode.length ? joinCode.charAt(i) : '·';
    $('join-code').textContent = t;
  }
  function joinDigit(k) {
    if (joinCode.length >= 4 || Net.client) return;
    joinCode += k;
    renderJoin();
    if (joinCode.length === 4) {
      $('join-msg').textContent = 'Під’єднуємось… Чекаємо вчителя.';
      $('join-msg').classList.remove('hidden');
      netConnect(joinCode, 'student', function () {
        send('hello', {});
        // Якщо вчитель ще не відкрив кімнату, повторюємо привітання, доки не прийде setup.
        Net.helloTimer = window.setInterval(function () { send('hello', {}); }, 3000);
      }, function (msg) {
        $('join-msg').textContent = msg;
        joinCode = '';
        renderJoin();
      });
    }
  }
  function joinDel() {
    if (Net.client) return;
    joinCode = joinCode.slice(0, -1);
    renderJoin();
  }

  /* ---------- Повідомлення ---------- */

  function onNet(name, d) {
    if (Net.role === 'teacher') {
      if (name === 'hello') {
        setPeer('Учень у грі');
        sendSetup();
      } else if (name === 'move') {
        netMove(d);
      } else if (name === 'bye') {
        setPeer('Учень вийшов');
      }
      return;
    }
    // Учень
    if (name === 'setup') {
      if (Net.helloTimer) { window.clearInterval(Net.helloTimer); Net.helloTimer = null; }
      var lv = parseInt(d.level, 10);
      if (!(lv >= 1 && lv <= LEVEL_COUNT) || !isMoveList(d.moves)) return;
      var same = G.state && G.mode === 'online' && G.gameNo === d.game && G.moves.length === d.moves.length;
      if (same) return;
      G.gameNo = d.game;
      $('room-code').textContent = Net.code;
      peerText = 'Вчитель на зв’язку';
      startGame(lv, { mode: 'online', real: !!d.real, opponent: 'teacher', me: 'w', moves: d.moves });
      setPeer(peerText);
    } else if (name === 'move') {
      netMove(d);
    } else if (name === 'bye') {
      setPeer('Вчитель вийшов');
    }
  }

  function isMoveList(list) {
    if (!list || typeof list.length !== 'number' || list.length > 400) return false;
    for (var i = 0; i < list.length; i++) {
      if (!list[i] || !isSq(list[i][0]) || !isSq(list[i][1])) return false;
    }
    return true;
  }
  function isSq(x) { return typeof x === 'number' && x >= 0 && x < 25 && Math.floor(x) === x; }

  function netMove(d) {
    if (!G.state || G.mode !== 'online' || d.game !== G.gameNo) return;
    if (G.busy && d.ply === G.state.plies) {
      // Ще анімується попередній хід — приймемо цей трохи пізніше.
      gameLater(function () { netMove(d); }, 200);
      return;
    }
    if (d.ply !== G.state.plies || G.state.turn === G.me) {
      // Розсинхронізація: учень просить стан, вчитель надсилає його.
      if (d.ply >= G.state.plies) {
        if (Net.role === 'teacher') sendSetup(); else send('hello', {});
      }
      return;
    }
    var m = isSq(d.from) && isSq(d.to) ? MC.findMove(G.state, d.from, d.to) : null;
    if (m) playMove(m, true);
  }

  /* ================== ПОДІЇ ================== */

  function renderTopButtons() {
    $('btn-sound').innerHTML = progress.mute ? ICONS.soundOff : ICONS.soundOn;
    $('btn-sound').setAttribute('aria-label', progress.mute ? 'Увімкнути звук' : 'Вимкнути звук');
    $('btn-sound').setAttribute('aria-pressed', progress.mute ? 'true' : 'false');
    $('btn-lock').innerHTML = progress.all ? ICONS.unlock : ICONS.lock;
  }

  function init() {
    $('btn-home').innerHTML = ICONS.home;
    $('btn-speak').innerHTML = ICONS.speak;
    $('btn-join').innerHTML = ICONS.people + 'Грати з вчителем';
    $('btn-restart').innerHTML = ICONS.retry + 'Почати знову';
    $('btn-bear').innerHTML = AVATARS.bear + 'Ведмедик<small>легко</small>';
    $('btn-fox').innerHTML = AVATARS.fox + 'Лисичка<small>хитро</small>';
    renderTopButtons();
    renderMap();

    $('btn-home').addEventListener('click', goHome);
    $('btn-sound').addEventListener('click', function () {
      progress.mute = !progress.mute;
      saveProgress();
      renderTopButtons();
      Sound.unlock();
      Sound.play('select');
    });
    $('btn-lock').addEventListener('click', function () { Sound.unlock(); openPin(); });
    $('pin-cancel').addEventListener('click', function () { hideOverlay('pin'); });
    buildPad($('pin-pad'), pinDigit, function () { pinValue = pinValue.slice(0, -1); renderPinDots(); });

    $('btn-speak').addEventListener('click', function () { speak($('hint-text').textContent); });
    if (window.speechSynthesis) {
      findVoice();
      if (window.speechSynthesis.addEventListener) window.speechSynthesis.addEventListener('voiceschanged', findVoice);
    }

    var rb = $('rules-toggle').getElementsByTagName('button');
    for (var i = 0; i < rb.length; i++) {
      rb[i].addEventListener('click', function () {
        intro.real = this.getAttribute('data-real') === '1';
        renderIntro();
      });
    }
    var tb = $('teacher-rules').getElementsByTagName('button');
    for (i = 0; i < tb.length; i++) {
      tb[i].addEventListener('click', function () {
        teacherPick.real = this.getAttribute('data-real') === '1';
        renderTeacher();
      });
    }

    $('btn-bear').addEventListener('click', function () {
      Sound.unlock();
      startGame(intro.level, { mode: 'bot', real: intro.real, opponent: 'bear' });
    });
    $('btn-fox').addEventListener('click', function () {
      Sound.unlock();
      startGame(intro.level, { mode: 'bot', real: intro.real, opponent: 'fox' });
    });
    $('btn-restart').addEventListener('click', function () {
      if (G.mode === 'online') { if (G.me === 'b') teacherNewGame(); return; }
      startGame(G.level, { mode: 'bot', real: G.real, opponent: G.opponent });
    });

    $('btn-join').addEventListener('click', function () { Sound.unlock(); openJoin(); });
    buildPad($('join-pad'), joinDigit, joinDel);

    $('btn-unlock-all').addEventListener('click', function () {
      progress.all = !progress.all;
      saveProgress();
      renderTopButtons();
      renderTeacher();
      renderMap();
    });
    $('btn-reset').addEventListener('click', function () {
      if (!window.confirm('Скинути всі зірочки на цьому пристрої?')) return;
      var keepMute = progress.mute;
      progress = blankProgress();
      progress.mute = keepMute;
      saveProgress();
      renderTopButtons();
      renderTeacher();
      renderMap();
    });
    $('btn-create-room').addEventListener('click', createRoom);

    window.addEventListener('pagehide', netClose);
  }

  init();
})();
</script>
</body>
</html>
